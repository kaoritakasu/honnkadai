<div class="login-container">
  <div class="login-card">
    <!-- タイトル部分：ログインモードなら「ログイン」、登録モードなら「新規登録」 -->
    <h1>{{ isLogin() ? 'ログイン' : '新規登録' }}</h1>

    @if (error()) {
      <div class="error-message">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      @if (!isLogin()) {
        <div class="form-group">
          <label for="name">名前</label>
          <input
            id="name"
            type="text"
            [(ngModel)]="name"
            name="name"
            required
          />
        </div>
      }

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      @if (!isLogin()) {
        <div class="form-group">
          <label for="employeeNumber">社員番号</label>
          <input
            id="employeeNumber"
            type="text"
            [(ngModel)]="employeeNumber"
            name="employeeNumber"
            placeholder="例: EMP001"
          />
        </div>
      }

      @if (!isLogin()) {
        <div class="form-group">
          <label for="role">権限</label>
          <select
            id="role"
            [(ngModel)]="role"
            name="role"
          >
            <option value="EMPLOYEE">一般社員</option>
            <option value="ADMIN">管理者（人事）</option>
          </select>
        </div>
      }

      <!-- ボタンの文字も日本語化 -->
      <button type="submit" [disabled]="loading()">
        {{ loading() ? '処理中...' : (isLogin() ? 'ログイン' : '登録する') }}
      </button>
    </form>

    <!-- 下部の切り替えリンク -->
    <p class="toggle-mode">
      {{ isLogin() ? "アカウントをお持ちでないですか？" : 'すでにアカウントはお持ちですか？' }}
      <a href="javascript:void(0)" (click)="toggleMode()">
        {{ isLogin() ? '新規登録はこちら' : 'ログインはこちら' }}
      </a>
    </p>
  </div>
</div>
